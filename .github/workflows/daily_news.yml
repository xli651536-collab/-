"""
每日新闻摘要自动化脚本
- 抓取美国、日本、加密投资类RSS新闻
- 筛选过去24小时内的新闻
- 周一额外增加上周会议与事件汇总
- 调用Claude API生成中文摘要
- 通过SMTP发送到多个邮箱
"""

import os
