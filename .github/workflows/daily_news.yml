name: Daily News Digest

on:
  schedule:
    # 北京时间 08:20 = UTC 00:20 (北京时间 - 8小时)
    # 注意：避开整点，降低GitHub Actions排队概率
    - cron: '20 0 * * *'
  workflow_dispatch:  # 保留手动触发

permissions:
  contents: read

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install feedparser requests python-dateutil pytz

      - name: 运行新闻摘要脚本
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python news_digest.py

      - name: 记录执行结果
        if: always()
        run: |
          echo "工作流执行完成于: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

2. 调整后的 news_digest.py

