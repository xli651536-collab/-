name: Daily News Digest

on:
  schedule:
    # 备用触发：UTC 02:17 = 北京时间 10:17（GitHub 定时任务经常延迟数小时，只作兜底）
    # 主触发由 cron-job.org 在北京时间 08:20 调用 workflow_dispatch
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      force_weekly:
        description: '测试用：强制附带周报'
        type: boolean
        default: false

permissions:
  contents: write   # 需要写权限，用来把每天的日报存档提交到 archive/，供周一周报使用
  pages: write      # 发布 GitHub Pages（events.ics）
  id-token: write   # Pages 发布需要 OIDC 令牌

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查今天是否已发送
        id: check
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "archive/sent/$TODAY" ]; then
            echo "今天已经发送过，备用任务跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 设置 Python 环境
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        if: steps.check.outputs.skip != 'true'
        run: pip install feedparser requests markdown

      - name: 生成并发送简报
        if: steps.check.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: https://kitool.ai
          CLAUDE_MODELS: claude-sonnet-5,claude-sonnet-4-6,claude-opus-4-6
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE_WEEKLY: ${{ inputs.force_weekly }}
        run: python news_digest.py

      - name: 保存日报存档和日历事件
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p archive/sent
          touch "archive/sent/$(TZ=Asia/Shanghai date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898932+github-actions[bot]@users.noreply.github.com"
          git add archive/ events/ 2>/dev/null || git add archive/
          if git diff --cached --quiet; then
            echo "没有新的存档"
          else
            git commit -m "archive: $(TZ=Asia/Shanghai date +%F)"
            git push
          fi

      - name: 上传 ICS 到 Pages 构件
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: calendar   # 目录下的 events.ics 将发布到 GitHub Pages 根路径

  deploy-pages:
    needs: send-digest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
