name: Daily News Digest

on:
  schedule:
    # GitHub 使用 UTC 时间：UTC 00:05 = 北京时间 08:05
    # GitHub 定时任务通常会延迟 5~20 分钟，所以提前一点，实际到达约 08:10~08:30
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      force_weekly:
        description: '测试用：强制附带周报'
        type: boolean
        default: false

permissions:
  contents: write   # 需要写权限，用来把每天的日报存档提交到 archive/，供周一周报使用

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install feedparser requests markdown

      - name: 生成并发送简报
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: https://kitool.ai
          CLAUDE_MODELS: claude-sonnet-5,claude-sonnet-4-6,claude-opus-4-6
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE_WEEKLY: ${{ inputs.force_weekly }}
        run: python news_digest.py

      - name: 保存日报存档
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898932+github-actions[bot]@users.noreply.github.com"
          git add archive/
          if git diff --cached --quiet; then
            echo "没有新的存档"
          else
            git commit -m "archive: $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
